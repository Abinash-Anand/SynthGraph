name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: synthgraph-backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: synthgraph
          POSTGRES_PASSWORD: synthgraph
          POSTGRES_DB: synthgraph
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U synthgraph"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://synthgraph:synthgraph@localhost:5432/synthgraph
      JWT_SECRET: ci-test-secret-not-for-production-use
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: synthgraph-backend/package-lock.json

      # npm 10.x (bundled with actions/setup-node's default) crashes resolving
      # this tree's conflicting typescript peer ranges - same issue documented
      # in synthgraph-backend/Dockerfile, same fix.
      - run: npm install -g npm@11

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (also typechecks)
        run: npm run build

      # vitest.config.ts's own `include` also sweeps in **/*.e2e-spec.ts
      # (see test/*.e2e-spec.ts), so `npm test` needs the schema migrated
      # too, not just the dedicated e2e run below.
      - name: Run migrations
        run: npm run migration:run

      # vitest runs the sources, not the build, and never applies the
      # @nestjs/swagger CLI plugin, so a schema problem that only `nest build`
      # introduces passes every test and then crashes the real server at
      # startup. This boots dist/main.js and checks /docs-json; see
      # scripts/smoke-boot.mjs.
      - name: Boot the built backend
        run: npm run smoke:boot

      - name: Unit tests
        run: npm test

      - name: E2E tests
        run: npm run test:e2e

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: synthgraph-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: synthgraph-frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Node strips the types itself, so there is no test-runner dependency
      # and nothing here touches the lockfile.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
