[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synthgraph"
version = "0.1.0"
description = "Python SDK for SynthGraph experiment provenance and lineage tracking."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "SynthGraph" }
]
dependencies = [
    "pydantic>=2.0,<3.0",
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/synthgraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true