[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synthgraph-sdk"
version = "0.3.0"
description = "Python SDK and CLI for SynthGraph experiment provenance and lineage tracking."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "SynthGraph" }]
keywords = ["provenance", "lineage", "synthetic-data", "reproducibility", "research"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

# The core package stays small on purpose: an HTTP client, a model layer and a
# CLI framework. No research tooling, no ML frameworks, no storage SDKs.
dependencies = [
  "httpx>=0.27,<1.0",
  # exclude_if= on Field() (used by models/generation.py) requires 2.12+.
  "pydantic>=2.12,<3.0",
  "typer>=0.12,<1.0",
]

[project.optional-dependencies]
# environment.resource_metadata() reports CPU/memory usage when this is
# installed, and always works without it (cpu_count and GPU stats, the
# latter via nvidia-smi, need no dependency at all).
resource = ["psutil>=5.9,<7.0"]
dev = [
  "mypy>=1.11,<2.0",
  "pytest>=8.0,<10.0",
  "pytest-cov>=5.0",
  "ruff>=0.6,<1.0",
  "build>=1.0",
]

[project.scripts]
synthgraph = "synthgraph.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/synthgraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: needs a live SynthGraph backend (opt in with SYNTHGRAPH_INTEGRATION_TESTS=1)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RET", "RUF", "DTZ", "PL", "BLE", "ISC"]
ignore = [
  "PLR0913",  # provenance capture legitimately takes many optional fields
  "PLR2004",  # magic values in tests are the point
  "PLR0911",  # dispatch-by-type functions read better as a chain of returns
  "PLR0912",  # same
  "UP042",    # GenerationStatus stays (str, Enum): StrEnum would change str()
]

[tool.ruff.lint.per-file-ignores]
# typer.Option()/typer.Argument() in a signature default is the framework idiom.
"src/synthgraph/cli/commands/*.py" = ["B008"]
"src/synthgraph/cli/main.py" = ["B008"]
# Tests import inside functions on purpose (checking import behaviour) and keep
# pytest.raises separate from the block under test for readability.
"tests/**" = ["PLC0415", "SIM117", "PLW1510"]

[tool.mypy]
python_version = "3.11"
packages = ["synthgraph"]
mypy_path = "src"
strict = false
warn_unused_ignores = true
